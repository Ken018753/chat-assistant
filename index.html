<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高情商聊天助手</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 顶部 Header -->
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-icon">💬</div>
        <div class="logo-text">高情商聊天助手<span class="sub">得体回复，一键生成</span></div>
      </div>
      <button class="header-btn" id="history-toggle">
        <span class="icon">🕐</span>
        <span>历史记录</span>
      </button>
    </div>
  </header>

  <!-- 主体两栏布局 -->
  <main class="main">

    <!-- 左侧：输入区 -->
    <section>
      <!-- 聊天上下文 -->
      <div class="card">
        <div class="card-label">
          <span class="label-icon">💬</span>
          <span>聊天上下文</span>
          <span class="label-optional">(选填，贴入最近几句聊天记录效果更好)</span>
        </div>
        <textarea
          id="chat-context"
          class="textarea"
          placeholder="粘贴对方最近的聊天内容，例如：&#10;对方：这个方案我觉得不太行，能不能重新做一版？"
        ></textarea>
      </div>

      <!-- 聊天目的 -->
      <div class="card">
        <div class="card-label">
          <span class="label-icon">🎯</span>
          <span>聊天目的</span>
          <span class="label-required">*必填</span>
        </div>
        <textarea
          id="purpose"
          class="textarea"
          placeholder="例如：&#10;拒绝同事让我帮忙做PPT"
        ></textarea>
        <div class="quick-scenarios">
          <button class="quick-scenario" data-purpose="拒绝同事的不合理请求">❌ 拒绝</button>
          <button class="quick-scenario" data-purpose="感谢领导的指导和帮助">🙏 感谢</button>
          <button class="quick-scenario" data-purpose="为之前的失误道歉">💐 道歉</button>
          <button class="quick-scenario" data-purpose="向领导请假一天处理私事">📅 请假</button>
          <button class="quick-scenario" data-purpose="向领导汇报本周工作进展">📊 汇报</button>
          <button class="quick-scenario" data-purpose="催促对方尽快回复">⏰ 催促</button>
          <button class="quick-scenario" data-purpose="邀请朋友周末聚餐">🎉 邀约</button>
          <button class="quick-scenario" data-purpose="给长辈送上节日祝福">✨ 祝福</button>
          <button class="quick-scenario" data-purpose="安慰朋友失落的心情">🤗 安慰</button>
        </div>
      </div>

      <!-- 关系标签 -->
      <div class="card">
        <div class="card-label">
          <span class="label-icon">👥</span>
          <span>对方与你的关系</span>
        </div>
        <div class="tags-wrap" id="relationship-tags"></div>
      </div>

      <!-- 风格选择 -->
      <div class="card">
        <div class="card-label">
          <span class="label-icon">🎨</span>
          <span>回复风格</span>
        </div>
        <div class="tags-wrap" id="style-tags"></div>
      </div>

      <!-- 生成按钮 -->
      <div class="card" style="background: transparent; border: none; box-shadow: none; padding: 0;">
        <button class="generate-btn" id="generate-btn">
          <span class="btn-text">✨ 生成高情商回复</span>
          <span class="btn-loading">
            <span class="spinner"></span>
            <span>正在生成...</span>
          </span>
          <span class="btn-shortcut">Ctrl + Enter</span>
        </button>
      </div>
    </section>

    <!-- 右侧：结果区 -->
    <section class="result-section">
      <div class="result-panel" id="result-panel">
        <div class="result-placeholder">
          <div class="placeholder-icon">🪄</div>
          <div class="placeholder-title">等待生成</div>
          <div class="placeholder-desc">
            输入聊天目的，选择关系与风格<br>
            AI 将为你生成 3 个不同角度的得体回复
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- 历史记录侧边栏 -->
  <div class="overlay" id="overlay"></div>
  <aside class="history-panel" id="history-panel">
    <div class="history-header">
      <div class="history-title">📚 历史记录</div>
      <div class="history-actions">
        <button class="history-clear" id="clear-history">清空</button>
        <button class="history-close" id="history-close">关闭</button>
      </div>
    </div>
    <div class="history-list" id="history-list"></div>
  </aside>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
